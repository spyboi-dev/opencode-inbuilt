# Build the Kernarium guest runtime for iOS arm64, link it into the
# OpenCode inbuilt app, and upload the IPA as an artifact.
#
# Pipeline (see KERNARIUM-ENGINE.md for the full design):
#   1. Clone Kernarium at the pinned commit fbe12ee (no vendoring).
#   2. Build the upstream artifacts the runtime needs, in order:
#      - dependency prefixes: apple-gpu-vulkan-experiment (Mesa/Zink/
#        KosmicKrisp/libepoxy/virglrenderer), ios-network (GLib/libslirp),
#        kernel-host-tools (pahole + static libelf for the kernel's BTF)
#      - the mainline 6.18 arm64 kernel bundle, built from the pinned
#        source and published to .build/kernel/artifacts
#      - the Kernarium runtime tree (cmake --preset kernarium-ios-device),
#        which produces KRuntime_6_18_4K.framework
#   3. ./build-kernarium.sh links the app with the runtime framework
#      (OC_KERNARIUM_LINKED) and produces build/OpenCode-Inbuilt.ipa.
#      The GPU frameworks come from Frameworks/ in this repo,
#      vendored from the Andarium release IPA.
#
# Deliberate deviation from upstream's packaging script
# (Kernarium/scripts/package-ios-frameworks.sh): it is NOT run here.
# It is a consumer of prebuilt artifacts that also demands the Android
# runtime tree (and its kernel) although this app ships only the Linux
# runtime, and its checks (privacy manifests, dSYM stripping, no
# software renderer) are App Store concerns, not sideload ones. The
# Linux runtime framework is taken straight from the runtime-tree
# build output -- exactly the slice the packaging script itself
# consumes as its input. The Android runtime is never built.
#
# Runner: xcode-27 (NOT macos-26). Upstream targets the iOS 27 SDK: its
# audio code uses iOS 27-only AVFoundation APIs
# (AVAudioEngine connect:to:format:error:, AVAudioPlayerNode
# playAndReturnError:, AVAudioSessionDidBecomeInactiveNotification and
# AVAudioSessionResumptionRecommendationNotification) and its Apple.cmake
# hardcodes deployment target 27.0. The stock macos-26 image ships Xcode
# only up to 26.6 (iOS SDK 26.5), so the runtime build fails at
# darwin/device/audio/apple_playback_sink.mm with 7 errors (run
# 44712652705). The xcode-27 image (public preview) carries Xcode 27 with
# the iOS 27 SDK. If GitHub retires the xcode-27 label, the fallback is
# macos-27 once it is GA, or patching the audio file to the older APIs.
#
# Xcode pin (2026-11-20): the Select step pins a STABLE Xcode 27.0
# GA, never a beta. The Kernarium IPAs built with Xcode 27.3 beta die
# ~1s after launch in LiveContainer (before didFinishLaunching,
# SIGKILL-class, no log) while the old stable-Xcode-26 build ran
# fine there, so the beta toolchain is a prime suspect. If no
# Xcode_27.0.app is on the runner, the step takes the newest
# non-beta Xcode 27 and says so in the log.
#
# Runner limits (xcode-27 standard: same class as macos-26 standard, 3
# vCPU, 7 GB RAM; disk was a 320 Gi volume with ~96 Gi free on macos-26,
# verify again if the build ever complains about disk): the GPU prefix
# build (full Mesa) and the kernel build are the long poles; every heavy
# step runs at --jobs 3, and the built prefixes + kernel bundle are cached
# (actions/cache) so a retry reuses them. Bump the cache key suffix
# (v1 -> v2 ...) when the workflow or the pinned commit changes in a way
# that must invalidate the cache. Do NOT delete Xcode installs to free
# disk: the versioned Xcode names are symlinks to the short-named install,
# and deleting the real directory breaks the selected Xcode (xcrun: missing
# DEVELOPER_DIR path, run 44672237845).
#
# Mesa endianness patch (run 44675218407): the Mesa GL config fails at
# u_endian.h:98 "UTIL_ARCH_LITTLE_ENDIAN and/or UTIL_ARCH_BIG_ENDIAN were
# unset". Meson defines HAVE_ENDIAN_H because <endian.h> exists in the
# iPhoneOS SDK, but Darwin's endian.h does not provide the glibc
# __BYTE_ORDER / BSD BYTE_ORDER macros that branch tests, and the
# __APPLE__ branch that uses __DARWIN_BYTE_ORDER is skipped because
# HAVE_ENDIAN_H is already defined. Patching the prepared Mesa source is
# NOT an option: prepare.sh's verify step requires the prepared tree to
# be clean and at the pinned tree, and rejects a dirty tree. So the
# workflow patches the build script itself (the cloned checkout, which
# nothing verifies): it appends -DUTIL_ARCH_LITTLE_ENDIAN=1 and
# -DUTIL_ARCH_BIG_ENDIAN=0 to the four EPOXY_CROSS arg lines. VIRGL_CROSS
# is derived from EPOXY_CROSS by awk, so the defines flow into both Mesa
# configs, virglrenderer, and libepoxy. arm64 iOS is little-endian, so
# the values are correct for the target.
#
# Triggered manually, or on pushes to kernarium-engine that touch the
# app, the build script, the resources, or this workflow. main is
# untouched: the LinuxRunner build keeps shipping from build-core.yml.
name: Build Kernarium engine + IPA

on:
  workflow_dispatch:
  push:
    branches: [kernarium-engine, kernarium-desktop]
    paths:
      - 'src/**'
      - 'build-kernarium.sh'
      - 'Frameworks/**'
      - 'resources/**'
      - 'rootfs-build/**'
      - '.github/workflows/build-kernarium.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    env:
      # Prepared dependency sources live on the case-sensitive volume
      # (some upstream trees have case-colliding paths); every
      # dependency build script reads this variable.
      UML_DEPENDENCY_SOURCE_ROOT: /Volumes/KernCase/deps-sources
      # Do NOT set IPHONEOS_DEPLOYMENT_TARGET at job level. Apple's
      # clang reads it from the environment and targets iPhone for
      # EVERY compile, including the host tools (gawk, elfutils,
      # pahole): they build as iOS binaries that the macOS kernel
      # kills on execution (Killed: 9, run 44673055527), and gawk's
      # configure then dies with "cannot run C compiled programs"
      # (run 44670686952). Every iOS target in this pipeline is set
      # explicitly where it belongs: build-kernarium.sh passes
      # -target arm64-apple-ios27.0, the dependency scripts hardcode
      # DEPLOYMENT_TARGET=27.0, and cmake/toolchains/Apple.cmake
      # hardcodes 27.0.
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          # Pin a STABLE Xcode 27 (GA), never a beta. The Kernarium IPAs
          # built with Xcode 27.3 beta (the newest Xcode_27* on the
          # runner) die ~1s after launch in LiveContainer, before
          # didFinishLaunching, SIGKILL-class with no log, while the
          # old stable-Xcode-26 build ran fine there — so the beta
          # toolchain is a prime suspect. Prefer Xcode_27.0.app
          # exactly; else the newest Xcode 27 whose name contains no
          # "beta"; else any Xcode 27 (loud warning — only a beta was
          # available); else any Xcode at all.
          XCODE=""
          for cand in /Applications/Xcode_27.0.app /Applications/Xcode_27.0.0.app; do
            if [ -d "$cand" ]; then XCODE="$cand"; break; fi
          done
          if [ -z "$XCODE" ]; then
            XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          fi
          if [ -z "$XCODE" ]; then
            echo "WARNING: no stable Xcode 27 found; falling back to the newest Xcode 27 (possibly beta)"
            XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$XCODE" ]; then XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"; fi
          if [ -z "$XCODE" ]; then echo "no Xcode found:"; ls /Applications | grep -i xcode || true; exit 1; fi
          # The versioned names (Xcode_26.6.0.app) can be symlinks to
          # the short-named install (Xcode_26.6.app); resolve to the
          # real directory so nothing later can break the link.
          XCODE="$(realpath "$XCODE" 2>/dev/null || echo "$XCODE")"
          echo "Using $XCODE"
          echo "XCODE=$XCODE" >> "$GITHUB_ENV"
          # Pin the developer dir for every later step: xcrun honors
          # DEVELOPER_DIR above the system xcode-select setting, so the
          # builds use this Xcode even if that setting is reset.
          # (Run 44670686952 failed because gawk's configure picked up
          # the CommandLineTools clang instead of Xcode's.)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          # Record whether the selected Xcode is a beta, for the record.
          if xcodebuild -version 2>/dev/null | grep -qi beta; then echo "WARNING: selected Xcode reports itself as a beta"; fi

      - name: Install Metal Toolchain
        run: |
          # The GPU prefix build (Mesa native tools) compiles Metal
          # shaders with `xcrun -sdk macosx metal`; that tool lives in
          # the separately downloadable Metal Toolchain component, which
          # the xcode-27 image does not preinstall (run 44717979005:
          # "cannot execute tool 'metal' due to missing Metal
          # Toolchain"). Download it once per job; the build fails
          # without it.
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx --find metal
          echo "Metal Toolchain installed"

      - name: Check disk space
        # The runner has ~96 Gi free (observed on run 44672237845), so
        # no cleanup is needed. An earlier version of this step deleted
        # the other Xcode versions to free disk; that broke the build
        # because the versioned Xcode names are symlinks to the
        # short-named install, and deleting the real directory left the
        # selected Xcode pointing at nothing (xcrun: missing
        # DEVELOPER_DIR path). Never delete Xcode installs here.
        run: df -h /

      - name: Install host tools
        run: |
          # Git identity for patch-series replay (local CI operations only).
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # Check each host tool; install only what's missing.
          # NOTE: macOS ships /usr/bin/bison (2.3, too old for Mesa),
          # /usr/bin/libtool (Apple's, not GNU's) and no gmake, so the
          # checks below look for the Homebrew names, not the system ones.
          # bison and flex are NOT in the check loop on purpose: the
          # system ships both, so `command -v` finds them and the
          # Homebrew versions would never be installed. They are
          # installed unconditionally below.
          NEED=""
          check() {
            if command -v "$1" >/dev/null 2>&1; then echo "have $1"; else echo "missing $1 -> brew $2"; NEED="$NEED $2"; fi
          }
          check cmake cmake
          check ninja ninja
          check meson meson
          check pkg-config pkg-config
          check gmake make
          check rsync rsync
          check autoconf autoconf
          check automake automake
          check glibtoolize libtool
          check gettext gettext
          check gperf gperf
          check groff groff
          # Mesa needs bison >= 3 and a modern flex; the system ships
          # bison 2.3 and Apple's flex, so install Homebrew's outright.
          NEED="$NEED bison flex"
          if [ -n "$NEED" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install $(echo "$NEED" | tr ' ' '\n' | sort -u | tr '\n' ' ')
          fi
          # bison, flex, make, libtool and gettext are keg-only: their
          # binaries live under $(brew --prefix <formula>)/bin and are
          # NOT linked into /opt/homebrew/bin, so put those dirs first
          # on PATH for every later step. (Homebrew LLVM is deliberately
          # NOT added: the app/runtime builds use xcrun clang, and the
          # kernel steps get the LLVM bin dir explicitly.)
          for f in bison flex make libtool gettext; do
            echo "$(brew --prefix "$f")/bin" >> "$GITHUB_PATH"
          done
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$(brew --prefix make)/bin:$(brew --prefix libtool)/bin:$(brew --prefix gettext)/bin:$PATH"
          # The GPU build script runs meson under `env -i` with a
          # hardcoded PATH (python/meson/ninja dirs plus
          # /usr/bin:/bin:/usr/sbin:/sbin), so the keg-only dirs above
          # never reach it and meson finds the system bison 2.3, which
          # cannot parse Mesa's grammar (run 44673473954). meson and
          # ninja live in /opt/homebrew/bin, which IS in that tool
          # path, so link bison/flex there. The env -i lines below
          # prove the script's sanitized PATH finds the new versions.
          brew link --force bison flex
          env -i PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" bison --version | head -1
          env -i PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" flex --version
          # autoreconf looks for `libtoolize`; Homebrew installs it as
          # `glibtoolize`. A symlink makes the elfutils/libffi builds work.
          if ! command -v libtoolize >/dev/null 2>&1; then
            sudo ln -sf "$(brew --prefix libtool)/bin/glibtoolize" /usr/local/bin/libtoolize
          fi
          echo "bison: $(command -v bison) $(bison --version | head -1)"
          echo "flex: $(command -v flex) $(flex --version)"
          echo "gmake: $(command -v gmake) $(gmake --version | head -1)"
          echo "libtoolize: $(command -v libtoolize)"
          # The kernel links ELF with ld.lld and publishes with
          # llvm-objcopy. Homebrew split LLD out of the llvm formula:
          # `brew install llvm` no longer ships ld.lld (run 44682817713
          # proved it: every other LLVM tool present, ld.lld absent,
          # and find /opt/homebrew -name ld.lld empty). It lives in
          # the separate `lld` formula, version-matched to llvm.
          # clang and the llvm-* tools still come from `llvm`.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm lld
          LLVM_BIN="$(brew --prefix llvm)/bin"
          LLD_BIN="$(brew --prefix lld)/bin"
          echo "LLVM tools: $LLVM_BIN"
          echo "LLD tools: $LLD_BIN"
          for t in clang clang++ llvm-objcopy llvm-ar llvm-nm llvm-objdump llvm-readelf llvm-strip; do
            if [ -x "$LLVM_BIN/$t" ]; then echo "have $t: $LLVM_BIN/$t"; else echo "MISSING $LLVM_BIN/$t"; fi
          done
          test -x "$LLVM_BIN/llvm-objcopy" || { echo "llvm-objcopy is not in $LLVM_BIN"; exit 1; }
          test -x "$LLD_BIN/ld.lld" || { echo "ld.lld is not in $LLD_BIN"; exit 1; }
          echo "LLVM_BIN=$LLVM_BIN" >> "$GITHUB_ENV"
          echo "LLD_BIN=$LLD_BIN" >> "$GITHUB_ENV"
          # Python 3.11+ and the modules the GPU build needs.
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)' 2>/dev/null; then
            echo "python3 is older than 3.11; installing python@3.12"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install python@3.12
            echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"
            export PATH="$(brew --prefix python@3.12)/bin:$PATH"
          fi
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11)' || { echo "python3 is older than 3.11"; exit 1; }
          python3 -c 'import mako, packaging, yaml' 2>/dev/null || \
            python3 -m pip install --user mako packaging pyyaml || \
            python3 -m pip install --break-system-packages mako packaging pyyaml

      - name: Verify toolchain
        run: |
          # Fail fast with a diagnosis if the C toolchain cannot run
          # the programs it compiles (run 44670686952 died in gawk's
          # configure with "cannot run C compiled programs" while using
          # the CommandLineTools clang instead of Xcode's).
          echo "xcode-select: $(xcode-select -p)"
          echo "DEVELOPER_DIR: ${DEVELOPER_DIR:-unset}"
          CC="$(xcrun --sdk macosx --find clang)"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "macOS clang: $CC"
          echo "macOS SDK: $SDKROOT"
          echo "iOS clang: $(xcrun --sdk iphoneos --find clang)"
          "$CC" --version | head -1
          printf 'int main(void){return 0;}\n' > /tmp/toolchain-test.c
          SDKROOT="$SDKROOT" MACOSX_DEPLOYMENT_TARGET=15.4 "$CC" /tmp/toolchain-test.c -o /tmp/toolchain-test
          /tmp/toolchain-test && echo "toolchain runs programs: OK"

      - name: Clone Kernarium (pinned commit)
        run: |
          git init kernarium
          cd kernarium
          git remote add origin https://github.com/imxieyi/Kernarium.git
          git fetch --depth 1 origin fbe12ee72d195f0241c4fc24090a98b259026604
          git checkout FETCH_HEAD
          test "$(git rev-parse HEAD)" = fbe12ee72d195f0241c4fc24090a98b259026604

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            kernarium/.build/dependency-cache
            kernarium/.build/kernel-cache
            kernarium/.build/dependencies
            kernarium/.build/kernel/artifacts
          key: kernarium-deps-fbe12ee-v2
          # Restore only v2 caches: the v1 cache holds prefixes built
          # with Xcode 26.6, and the fallback prefix would restore them
          # under Xcode 27. A v2 run with no v2 cache rebuilds fresh.
          restore-keys: |
            kernarium-deps-fbe12ee-v2

      - name: Create case-sensitive volume
        run: |
          # The Linux kernel source (and some dependency sources) has
          # paths that differ only by case; the runner's volume is
          # case-insensitive, so they live on a case-sensitive image.
          IMG="$RUNNER_TEMP/KernCase.sparseimage"
          rm -f "$IMG"
          hdiutil create -size 20g -fs "Case-sensitive APFS" -volname KernCase -type SPARSE "$IMG"
          hdiutil attach "$IMG" -mountpoint /Volumes/KernCase
          # Do NOT create /Volumes/KernCase/linux here: prepare-source.sh
          # materializes the pinned kernel source into it with
          # materialize-git.sh, which refuses any existing destination
          # (even an empty one). /Volumes/KernCase/kernel-build IS
          # created here because build-kernel.sh does mkdir -p on it.
          mkdir -p /Volumes/KernCase/deps-sources /Volumes/KernCase/kernel-build
          # Prove the volume is case-sensitive.
          mkdir -p /Volumes/KernCase/.casetest
          touch /Volumes/KernCase/.casetest/a /Volumes/KernCase/.casetest/A
          [ "$(ls /Volumes/KernCase/.casetest | wc -l | tr -d ' ')" -eq 2 ] || { echo "volume is not case-sensitive"; exit 1; }
          rm -rf /Volumes/KernCase/.casetest
          # Kernel source location (git-ignored config in the checkout).
          printf '%s\n' 'UML_KERNEL_SOURCE_DIR=/Volumes/KernCase/linux' > kernarium/kernel/mainline-6.18/source-location.conf
          df -h /

      - name: Prepare dependencies
        run: |
          cd kernarium
          # prepare.sh fetches pinned sources from several upstreams;
          # a transient upstream failure (Savannah returned HTTP 502
          # for gawk on run 44669547801) must not fail the whole build,
          # so each product is retried up to 3 times.
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "giving up after 3 attempts: $*"; return 1; fi
              echo "attempt $n failed, retrying in 30s: $*"
              sleep 30
            done
          }
          retry ./dependencies/prepare.sh --product apple-gpu-vulkan-experiment --root "$UML_DEPENDENCY_SOURCE_ROOT"
          retry ./dependencies/prepare.sh --product ios-network --root "$UML_DEPENDENCY_SOURCE_ROOT"
          retry ./dependencies/prepare.sh --product kernel-host-tools --root "$UML_DEPENDENCY_SOURCE_ROOT"
          retry ./dependencies/prepare.sh --archive-manifest dependencies/kernel-host-tools/archives.tsv

      - name: Build kernel host tools
        run: |
          cd kernarium
          # A cached prefix that no longer verifies is deleted and
          # rebuilt instead of failing the job.
          ./dependencies/build-kernel-host-tools.sh --verify-only || rm -rf .build/dependencies/kernel-host-tools
          ./dependencies/build-kernel-host-tools.sh --jobs 3

      - name: Patch GPU build (Mesa endianness)
        run: |
          # See the header note: Mesa 26.2.6's u_endian.h errors out on
          # the iOS device cross build because meson's HAVE_ENDIAN_H
          # branch does not satisfy Darwin's endian.h, and the prepared
          # Mesa source cannot be patched (prepare.sh verify rejects a
          # dirty tree). Patch the build script instead: append the two
          # endianness defines to the four EPOXY_CROSS arg lines (c,
          # cpp, objc, objcpp). VIRGL_CROSS is derived from EPOXY_CROSS
          # by awk, so both Mesa configs, virglrenderer and libepoxy
          # all get them. Fail loudly if the upstream script changes.
          python3 - <<'PY'
          import sys
          path = "kernarium/dependencies/build-apple-gpu.sh"
          old = "'-I$STAGE/include']"
          new = "'-I$STAGE/include', '-DUTIL_ARCH_LITTLE_ENDIAN=1', '-DUTIL_ARCH_BIG_ENDIAN=0']"
          with open(path) as f:
              text = f.read()
          n = text.count(old)
          if n != 4:
              print(f"expected 4 EPOXY_CROSS arg lines, found {n}; upstream script changed, aborting", file=sys.stderr)
              sys.exit(1)
          with open(path, "w") as f:
              f.write(text.replace(old, new))
          print("patched 4 EPOXY_CROSS arg lines with UTIL_ARCH endianness defines")
          PY
          grep -n "UTIL_ARCH" kernarium/dependencies/build-apple-gpu.sh

      - name: Build Apple GPU prefix (iOS device)
        run: |
          cd kernarium
          ./dependencies/build-apple-gpu.sh --platform ios --verify-only || rm -rf .build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64
          ./dependencies/build-apple-gpu.sh --platform ios --jobs 3
          df -h /

      - name: Build iOS network prefix
        run: |
          cd kernarium
          ./dependencies/build-ios-network.sh --platform ios --verify-only || rm -rf .build/dependencies/ios-device-arm64/network
          ./dependencies/build-ios-network.sh --platform ios --jobs 3

      - name: Build Linux kernel bundle (arm64, 4K)
        run: |
          cd kernarium
          # Absolute: verify-kernel-artifact.py requires an absolute
          # artifact root, and the reuse check above silently never
          # matched with a relative path.
          BUNDLE="$PWD/.build/kernel/artifacts/mainline-6.18-arm64-4k-20261119-6.18.60-ca1"
          if [ -d "$BUNDLE" ] && python3 kernel/common/artifacts/verify-kernel-artifact.py \
              --artifact "$BUNDLE" --common-root kernel/common \
              --abi-metadata kernel/common/abi/identity.env --compatible \
              --expected-family mainline-6.18 --expected-slice arm64 \
              --expected-release-series 6.18 \
              --descriptor kernel/mainline-6.18/artifacts/accepted-4k.env; then
            echo "reusing verified kernel bundle: $BUNDLE"
            exit 0
          fi
          echo "kernel bundle missing or invalid; rebuilding from source"
          rm -rf "$BUNDLE"
          # Guard: materialize-git.sh refuses an existing destination,
          # so the kernel source dir must not exist when
          # prepare-source.sh runs (the volume is fresh per run, but
          # never let a stray dir fail the step).
          rm -rf /Volumes/KernCase/linux
          ./kernel/mainline-6.18/scripts/prepare-source.sh --slice arm64
          export PATH="$LLVM_BIN:$LLD_BIN:$PATH"
          export UML_KERNEL_CC="$LLVM_BIN/clang"
          export UML_KERNEL_HOST_CC="$LLVM_BIN/clang"
          # Absolute path: build-kernel.sh resolves the linker with
          # `command -v` on the ambient PATH, and the bare name missed
          # it on run 44680870911 even with LLVM_BIN on PATH. ld.lld
          # comes from the separate `lld` formula, not `llvm`.
          export UML_KERNEL_LD="$LLD_BIN/ld.lld"
          ./kernel/mainline-6.18/build/build-kernel.sh --slice arm64 --build /Volumes/KernCase/kernel-build --jobs 3
          python3 kernel/mainline-6.18/build/publish-artifact.py \
            --source /Volumes/KernCase/linux \
            --build /Volumes/KernCase/kernel-build \
            --slice arm64 --product linux \
            --output-root "$PWD/.build/kernel/artifacts" \
            --release-id 20261119-6.18.60-ca1 \
            --objcopy "$LLVM_BIN/llvm-objcopy"
          test -f "$BUNDLE/kernel/vmlinux"
          # Align the accepted descriptor with the freshly built bundle.
          # The bundle was built from the pinned source (its tree and
          # ABI match the descriptor), but its kernel release label
          # (Kbuild setlocalversion, a git-history -g<hash> suffix)
          # differs from the descriptor's (run 44683524868: built
          # 6.18.60-g12b634b1ea06, descriptor 6.18.60-g0f1aac6de72d),
          # so the runtime-tree import rejects it. Update only the
          # release in the cloned descriptor (ephemeral checkout on the
          # runner, never a tracked file); every other field (tree,
          # ABI, family, slice, directory, release-id) is still
          # verified against it. Then re-run the full descriptor
          # verification here so a bad alignment fails fast.
          BUILT_RELEASE="$(cat "$BUNDLE/kernel/kernel.release")"
          echo "built kernel release: $BUILT_RELEASE"
          python3 - "$BUILT_RELEASE" <<'PY'
          import sys
          release = sys.argv[1]
          path = "kernel/mainline-6.18/artifacts/accepted-4k.env"
          lines = open(path).read().splitlines(keepends=True)
          out, found = [], False
          for line in lines:
              if line.startswith("UML_KERNEL_ARTIFACT_RELEASE="):
                  out.append(f"UML_KERNEL_ARTIFACT_RELEASE='{release}'\n")
                  found = True
              else:
                  out.append(line)
          if not found:
              sys.exit("UML_KERNEL_ARTIFACT_RELEASE line not found in accepted-4k.env")
          open(path, "w").writelines(out)
          print(f"accepted-4k.env release set to {release}")
          PY
          python3 kernel/common/artifacts/verify-kernel-artifact.py \
            --artifact "$BUNDLE" --common-root kernel/common \
            --abi-metadata kernel/common/abi/identity.env --compatible \
            --expected-family mainline-6.18 --expected-slice arm64 \
            --expected-release-series 6.18 \
            --descriptor kernel/mainline-6.18/artifacts/accepted-4k.env
          df -h /

      - name: Provide boot base archive
        run: |
          # The runtime tree embeds the guest boot base initramfs
          # (uml-boot-base-aarch64.cpio.gz). No published copy exists in
          # any Kernarium release and the macOS runner cannot build it
          # (Buildroot needs Linux), so it is vendored in bootbase/
          # (built 2026-11-20 from the pinned commit fbe12ee; see
          # bootbase/README.md and KERNARIUM-BUILD.md). Place it where
          # the runtime configure expects it, and update the boot-base
          # descriptor in the cloned checkout to this file's size and
          # SHA-256: a locally built base never matches the upstream
          # descriptor (Buildroot output is not bit-reproducible), the
          # same "accept" pattern already used for the kernel descriptor.
          # Release, file name and architecture are unchanged.
          mkdir -p kernarium/.build/rootfs/starter-20260928-boot-base-r1
          cp bootbase/uml-boot-base-aarch64.cpio.gz \
            kernarium/.build/rootfs/starter-20260928-boot-base-r1/
          SIZE="$(stat -f%z bootbase/uml-boot-base-aarch64.cpio.gz)"
          SHA="$(shasum -a 256 bootbase/uml-boot-base-aarch64.cpio.gz | awk '{print $1}')"
          echo "boot base: $SIZE bytes, sha256 $SHA"
          python3 - "$SIZE" "$SHA" <<'PY'
          import sys
          size, sha = sys.argv[1], sys.argv[2]
          path = "kernarium/tools/rootfs/boot-ramdisk/accepted-aarch64.env"
          lines = open(path).read().splitlines(keepends=True)
          out, found_size, found_sha = [], False, False
          for line in lines:
              if line.startswith("UML_BOOT_BASE_SIZE="):
                  out.append(f"UML_BOOT_BASE_SIZE={size}\n"); found_size = True
              elif line.startswith("UML_BOOT_BASE_SHA256="):
                  out.append(f"UML_BOOT_BASE_SHA256='{sha}'\n"); found_sha = True
              else:
                  out.append(line)
          if not (found_size and found_sha):
              sys.exit("boot base descriptor lines not found in accepted-aarch64.env")
          open(path, "w").writelines(out)
          print(f"accepted-aarch64.env set to size={size} sha256={sha}")
          PY

      - name: Build Kernarium runtime tree
        run: |
          cd kernarium
          cmake --preset kernarium-ios-device
          cmake --build --preset kernarium-ios-device --parallel 3
          test -d .build/kernarium-runtime-ios-device/Kernarium/Runtime/KRuntime_6_18_4K.framework
          df -h /

      - name: Build IPA with Kernarium engine linked
        run: ./build-kernarium.sh kernarium kernarium/.build/kernarium-runtime-ios-device/Kernarium/Runtime

      - name: Verify the runtime is in the binary
        run: |
          lipo -info build/Payload/OpenCode.app/OpenCode
          # The app loads the runtime via dlopen + dlsym (KernGlue.m),
          # so the runtime symbol is NOT in the app binary's symbol
          # table — it lives in the embedded framework, and the app
          # holds only the dlsym string. An nm check on the app binary
          # is the wrong test for this design (it failed run 44719562892
          # although the framework was built and linked). Verify instead:
          # the embedded framework exports the API symbol, and the app
          # binary contains the dlsym string.
          nm -arch arm64 build/Payload/OpenCode.app/Frameworks/KRuntime_6_18_4K.framework/KRuntime_6_18_4K | grep -q ' _kernarium_runtime_get_api_v28' \
            || { echo "Kernarium runtime symbol missing from the embedded framework"; exit 1; }
          strings build/Payload/OpenCode.app/OpenCode | grep -q 'kernarium_runtime_get_api_v28' \
            || { echo "dlsym string missing from the app binary"; exit 1; }
          # Early-log constructor (OCCrashLog.m): the DYLD OK marker
          # and BOOT.txt must be in the binary, or a pre-main death
          # leaves no file at all and there is nothing to diagnose.
          strings build/Payload/OpenCode.app/OpenCode | grep -q 'DYLD OK' \
            || { echo "early-log DYLD OK marker missing from the app binary"; exit 1; }
          strings build/Payload/OpenCode.app/OpenCode | grep -q 'BOOT.txt' \
            || { echo "BOOT.txt string missing from the app binary"; exit 1; }
          echo "early-log constructor strings present (DYLD OK, BOOT.txt)"
          # The "Calling UIApplicationMain" marker (main.m, just before
          # the UIApplicationMain call) must be in the binary: it is
          # what separates a death in main()'s tail from a death inside
          # UIApplicationMain on the next device log.
          strings build/Payload/OpenCode.app/OpenCode | grep -q 'Calling UIApplicationMain' \
            || { echo "Calling UIApplicationMain marker missing from the app binary"; exit 1; }
          echo "Calling UIApplicationMain marker present"
          echo "No Kernarium framework may appear as a load command at"
          echo "all (strong or weak): the app must be dlopen-only. The"
          echo "old working build had no dyld-loaded frameworks (core"
          echo "statically linked); the Kernarium builds carried weak"
          echo "load commands, and dyld still loads weak frameworks at"
          echo "launch — one unloadable framework under LiveContainer"
          echo "kills the launch before any app code runs, with no log"
          echo "at all. KernGlue loads KRuntime by path with dlopen +"
          echo "dlsym on first Start instead. Fail on ANY load command"
          echo "mentioning any of the four frameworks."
          for fw in KRuntime_6_18_4K KosmicKrisp MesaEGL MesaGallium; do
            if otool -L build/Payload/OpenCode.app/OpenCode | grep -q "$fw"; then
              echo "$fw appears as a load command (must be dlopen-only)"; exit 1
            fi
          done
          echo "no Kernarium load commands: dlopen-only"
          for fw in KRuntime_6_18_4K KosmicKrisp MesaEGL MesaGallium; do
            test -d "build/Payload/OpenCode.app/Frameworks/$fw.framework" \
              || { echo "missing embedded framework: $fw"; exit 1; }
          done
          echo "Kernarium runtime present (dlopen-only) and all four frameworks embedded"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Inbuilt-kernarium
          path: build/OpenCode-Inbuilt.ipa
